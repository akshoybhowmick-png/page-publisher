name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p app/www && cp index.html app/www/ && cd app
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6 html2canvas@1.4.1
          cp node_modules/html2canvas/dist/html2canvas.min.js www/
          echo '{"appId":"com.pagepublisher.app","appName":"Page Publisher","webDir":"www"}' > capacitor.config.json
          npx cap add android
      - name: App icon
        continue-on-error: true
        run: |
          sudo apt-get install -y imagemagick > /dev/null
          cd app && mkdir -p assets
          convert -size 1024x1024 xc:'#077568' -fill white -font DejaVu-Sans-Bold -pointsize 560 -gravity center -annotate 0 'P' assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          convert -size 1024x1024 xc:'#077568' assets/icon-background.png
          npx --yes @capacitor/assets@3 generate --android
      - name: Build APK
        run: |
          cd app && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../PagePublisher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PagePublisher-apk
          path: PagePublisher.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Page Publisher v1.0.${{ github.run_number }}
          files: PagePublisher.apk
